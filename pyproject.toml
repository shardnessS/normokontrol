[project]
name = "normokontrol-mcp"
version = "0.1.0"
description = "MCP server for formatting and checking Russian academic works per GOST 7.32-2017 and GOST R 7.0.100-2018"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "shardness", email = "shardness.dev@gmail.com" }
]
keywords = ["mcp", "gost", "normokontrol", "docx", "bibliography", "гост", "нормоконтроль"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3",
]

[project.scripts]
normokontrol-mcp = "normokontrol_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]
# RUF001–003: кириллица в строках и комментариях — норма для проекта.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
