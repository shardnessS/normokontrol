# Golden-тесты библиографических записей (ГОСТ Р 7.0.100-2018).
#
# Каждый эталон взят из опубликованного примера и указан в поле `ref`:
#   ГОСТ        — ГОСТ Р 7.0.100-2018, приложение / пункт (текст стандарта, ifap.ru/library/gost/701002018.pdf)
#   ТГПУ        — Научная библиотека ТГПУ, презентация «ГОСТ Р 7.0.100-2018» (libserv.tspu.ru)
#   ПОУНБ       — Псковская ОУНБ, презентация «ГОСТ Р 7.0.100-2018» (museumah.ru/files/docs/GOST_7.0.100_2018.pdf)
#   МГТУ        — Библиотека МГТУ им. Носова, памятка «Примеры … ГОСТ Р 7.0.100-2018», 2019 (lib.magtu.ru)
#   МГРИ        — Библиотека МГРИ, «Примеры библиографических записей (по ГОСТ Р 7.0.100-2018)» (mgri.ru)
# Поле `changes` перечисляет отличия эталона от печатного примера: исправленные опечатки
# и пробелы, а также места, где пример расходится с текстом стандарта (тогда прав стандарт).
# `style` — выбор библиографирующей организации: content_type (область «Текст : …»), dash.
# Сравнение идёт после замены неразрывных пробелов на обычные.

